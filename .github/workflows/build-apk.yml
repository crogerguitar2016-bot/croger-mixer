name: Gerar APK CROGER MIXER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar ferramentas Python
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.34"
          pip install git+https://github.com/kivy/buildozer.git@a153097b3c534bea8a17da2abf1369d67c8cbfcb

      - name: Instalar Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip

          mv cmdline-tools latest

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

      - name: Preparar Python-for-Android
        run: |
          git clone \
            https://github.com/kivy/python-for-android.git \
            "$HOME/p4a"

          cd "$HOME/p4a"

          git checkout \
            e772ad93f20a61c0bbe1cf8955e073cfb41062e1

      - name: Verificar arquivos do CROGER MIXER
        run: |
          echo "=== CROGER MIXER ==="
          ls -lh main.py
          ls -lh mixer_controller.py
          ls -lh android_audio.py
          ls -lh icon.png
          echo
          echo "=== IDENTIDADE ==="
          grep -n "title =\|package.name\|package.domain" buildozer.spec
          echo
          echo "=== TESTE DE SINTAXE ==="
          python -m py_compile main.py mixer_controller.py android_audio.py

      - name: Compilar APK
        env:
          ANDROIDSDK: /home/runner/android-sdk
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          buildozer -v android debug

      - name: Mostrar APK gerado
        run: |
          echo "=== APK GERADO ==="
          find bin -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CROGER-MIXER-APK
          path: bin/*.apk
          if-no-files-found: error
